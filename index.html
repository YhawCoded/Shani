<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070914">

  <link rel="stylesheet" href="style.css">

  <title>For Shani ✦</title>
</head>

<body>

  <!-- OPENING -->
  <main class="screen opening" id="opening">

    <div class="eyebrow">✦ A LITTLE SOMETHING ✦</div>

    <h1>Hey, Shani.</h1>

    <p class="subtitle">
      I made a tiny corner of the internet<br>
      just for you.
    </p>

    <button id="beginBtn">
      Tap to begin
      <span>→</span>
    </button>

    <p class="tiny-note">
      Take your time ♡
    </p>

  </main>


  <!-- USERNAME REVEAL -->
  <main class="screen reveal hidden" id="reveal">

    <p class="reveal-small">or should I say...</p>

    <h2>auri<span>☆</span></h2>

    <p class="reveal-text">
      Yeah.<br>
      I think I like that one better.
    </p>

    <button id="continueBtn">
      Continue
      <span>→</span>
    </button>

  </main>


  <script src="script.js"></script>

</body>
</html>  <script src="script.js"></script>

</body>
</html>
